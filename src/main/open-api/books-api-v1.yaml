openapi: 3.0.3
info:
  title: Book Library Management API
  description: |
    A comprehensive RESTful API for managing a book library system.
    This API provides full CRUD operations for book management including:
    - Adding new books with validation
    - Searching books by title or author
    - Updating book details
    - Deleting books from the library
  version: 1.0.2
  contact:
    name: Library Management Team
    email: library@example.com
    url: https://example.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.library.com
    description: Production server
tags:
  - name: Books
    description: Operations related to book management

paths:
  /books:
    get:
      tags:
        - Books
      summary: Get all books or search books
      description: |
        Retrieve all books from the library or search for specific books.
        You can search by title or author using query parameters.
      parameters:
        - name: title
          in: query
          description: Search books by title (partial match, case-insensitive)
          required: false
          schema:
            type: string
            example: "Spring Boot"
        - name: author
          in: query
          description: Search books by author (partial match, case-insensitive)
          required: false
          schema:
            type: string
            example: "John Doe"
      responses:
        '200':
          description: Successfully retrieved books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
              examples:
                all_books:
                  summary: All books response
                  value:
                    - id: 1
                      title: "Effective Java"
                      author: "Joshua Bloch"
                      isbn: "978-0-593-13520-5"
                      publicationYear: 2017
                    - id: 2
                      title: "Spring Boot in Action"
                      author: "Craig Walls"
                      isbn: "978-0-593-13520-5"
                      publicationYear: 2015
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Books
      summary: Add a new book
      description: Add a new book to the library with validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
            examples:
              new_book:
                summary: New book example
                value:
                  title: "Clean Code"
                  author: "Robert C. Martin"
                  isbn: "978-0-593-13520-5"
                  publicationYear: 2008
      responses:
        '201':
          description: Book successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              example:
                id: 3
                title: "Clean Code"
                author: "Robert C. Martin"
                isbn: "978-0-593-13520-5"
                publicationYear: 2008"
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Book with this ISBN already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Book with ISBN 978-0-593-13520-5 already exists"
                timestamp: "2024-01-15T12:00:00"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get book by ID
      description: Retrieve a specific book by its unique identifier
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the book
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Book found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              example:
                id: 1
                title: "Effective Java"
                author: "Joshua Bloch"
                isbn: "978-0-593-13520-5"
                publicationYear: 2017
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Books
      summary: Update book by ID
      description: Update an existing book's details
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the book to update
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
            example:
              title: "Effective Java (Updated Edition)"
              author: "Joshua Bloch"
              isbn: "978-0-593-13520-5"
              publicationYear: 2018
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              example:
                id: 1
                title: "Effective Java (Updated Edition)"
                author: "Joshua Bloch"
                isbn: "978-0-593-13520-5"
                publicationYear: 2018
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/BookNotFound'
        '409':
          description: ISBN conflict with another book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Another book with ISBN 978-0-593-13520-5 already exists"
                timestamp: "2024-01-15T13:00:00"
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Books
      summary: Delete book by ID
      description: Remove a book from the library
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the book to delete
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Book deleted successfully
        '404':
          $ref: '#/components/responses/BookNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    BookRequest:
      $ref: './common-types/BookRequest.yaml'
    Book:
      $ref: './common-types/Book.yaml'
    ErrorResponse:
      $ref: './common-types/ErrorResponse.yaml'
    ValidationErrorResponse:
      $ref: './common-types/ValidationErrorResponse.yaml'

  responses:
    BookNotFound:
      description: Book not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Book not found with id: 1"
            timestamp: "2024-01-15T10:30:00"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: "Validation failed"
            timestamp: "2024-01-15T10:30:00"
            errors:
              - field: "title"
                message: "Title is required"
              - field: "isbn"
                message: "ISBN format is invalid"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "An unexpected error occurred"
            timestamp: "2024-01-15T10:30:00"
